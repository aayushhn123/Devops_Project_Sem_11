<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceScope - Product Price Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M6 21l6-7 5 4 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/overview">
      <span class="logo"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M5 22l7-8 5 4 10-11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><b>PriceScope</b><small>Retail price tracker</small></span>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="team-title">DevOps Project</div>
      <div class="team"><span>E007</span> Aayush Nayak</div>
      <div class="team"><span>E008</span> Ritwik Shetty</div>
      <div class="team"><span>E037</span> Iram Shaikh</div>
      <div class="engine"><i></i> PostgreSQL <b id="pgver"></b></div>
      <div class="engine"><i></i> <span id="sideEnv">Checking runtime…</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
      <div class="search">
        <span class="search-ico" id="searchIco"></span>
        <input id="globalSearch" type="search" placeholder="Search any product, e.g. “airpods”, “4k tv”, “ssd 1tb”…" autocomplete="off">
        <div class="suggest" id="suggest" hidden></div>
      </div>
      <div class="top-actions">
        <a class="status-pill" id="statusPill" href="#/devops" title="Open the DevOps page"><i></i><span>Checking…</span></a>
        <button class="icon-btn" id="themeBtn" title="Toggle light / dark"></button>
        <button class="btn danger" id="shutdownBtn" title="Stop the PriceScope server" hidden></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="vendor/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
