apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricescope-app
  namespace: pricescope
  labels:
    app: pricescope-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pricescope-app
  template:
    metadata:
      labels:
        app: pricescope-app
    spec:
      serviceAccountName: pricescope-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: pricescope-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: pricescope-config
            - secretRef:
                name: pricescope-db
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Keep serving until the Service has stopped sending traffic here, so updates drop no requests.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pricescope-app
  namespace: pricescope
  labels:
    app: pricescope-app
spec:
  type: LoadBalancer
  selector:
    app: pricescope-app
  ports:
    - port: 8081
      targetPort: 5000
